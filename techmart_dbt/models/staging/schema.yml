version: 2

models:
  - name: stg_customers
    description: "Cleaned customer records extracted from the DummyJSON API."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer's first name."
        data_tests:
          - not_null

      - name: email
        description: "Customer's email address."
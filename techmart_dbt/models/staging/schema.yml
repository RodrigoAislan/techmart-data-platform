
version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data extracted from the raw API payload."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: "Customer's first name."
        data_tests:
          - not_null

      - name: email
        description: "Customer's email address."

  - name: stg_products
    description: "Structured product data extracted from the raw API payload."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - unique
          - not_null

      - name: title
        description: "Product title."
        data_tests:
          - not_null

      - name: price
        description: "Product price."

  - name: stg_orders
    description: "Structured order-level data extracted from the raw API payload."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null

      - name: total
        description: "Total order value before discounts."

  - name: stg_order_items
    description: "Individual product lines belonging to orders."
    columns:
      - name: order_id
        description: "Identifier of the parent order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null

      - name: quantity
        description: "Quantity of the product in the order."
        data_tests:
          - not_null
